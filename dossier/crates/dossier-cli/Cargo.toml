[package]
name = "dossier-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dossier"
path = "src/main.rs"

[dependencies]
dossier-assay = { path = "../dossier-assay" }
dossier-beatmap = { path = "../dossier-beatmap" }
dossier-replay = { path = "../dossier-replay" }
dossier-sim = { path = "../dossier-sim" }
dossier-render = { path = "../dossier-render" }
dossier-exhibit = { path = "../dossier-exhibit" }
dossier-audio = { path = "../dossier-audio" }
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny-skia = "0.11"

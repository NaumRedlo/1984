[workspace]
resolver = "2"
members = [
    "crates/dossier-replay",
    "crates/dossier-beatmap",
    "crates/dossier-sim",
    "crates/dossier-render",
    "crates/dossier-audio",
    "crates/dossier-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
thiserror = "2"
lzma-rs = "0.3"
